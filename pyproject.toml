[project]
name = "viessmann-optolink2mqtt"
authors = [
  { name="Francesco Montorsi", email="francesco.montorsi.nospam@gmail.com" },
  # author of original https://github.com/philippoo66/optolink-splitter project
  { name="Phil" },
]
description = "Open source interface between a Viessmann device (heat pump, gas heater, etc) and MQTT"
readme = "README.md"
# keep in sync with .python-version and the CI test matrix
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dynamic = ["dependencies", "version"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.urls]
"Homepage" = "https://github.com/f18m/viessmann-optolink2mqtt"
"Bug Tracker" = "https://github.com/f18m/viessmann-optolink2mqtt/issues"

[project.scripts]
optolink2mqtt = "optolink2mqtt.main:main"

[build-system]
requires = ["hatchling", "hatch-vcs", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/optolink2mqtt/_optolink2mqtt_version.py"
template = '''
version = "{version}"
'''

# NOTE: the project aims to stay compatible with Python 3.9, to support Debian 11
# and its derivatives (e.g. Raspberry Pi OS Legacy); lint for that version and flag
# PEP 604 annotations (X | None) used without "from __future__ import annotations"
[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# pyflakes + the syntax/statement pycodestyle checks, plus FA102
select = ["E4", "E7", "E9", "F", "FA102"]

# disable guessing of next version, 
# see https://setuptools-scm.readthedocs.io/en/latest/extending/#setuptools_scmversion_scheme
[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"
