#
# Viessmann-optolink2mqtt configuration file
# All values shown here are the default values
#

# config_version: version of the format of this file. Each optolink2mqtt release accepts only
# one version, and refuses to start with any other. Files without it are version 1.
# To convert a file written for an older version, use the upgrade tool at
# https://f18m.github.io/viessmann-optolink2mqtt/config-upgrade/
config_version: 2

logging:
  # logging.level: defines the logging level; it can be one of the following:
  #  - DEBUG
  #  - INFO
  #  - WARNING
  #  - ERROR
  #  - CRITICAL
  level: DEBUG

  # optolink2mqtt will report its own status (e.g. number of errors) every N seconds on its log output
  # and on the specific '<mqtt.publish_topic_prefix>/status' topic
  report_status_period_sec: 600

optolink:
  # Serial port for Optolink device (mandatory, default: '/dev/ttyUSB0')
  serial_port: '/dev/ttyUSB0'
  # Useful for debugging purposes only
  show_received_bytes: False
  # Period (in seconds) to wait before reconnecting to Optolink device if connection is lost;
  # Since apparently optolink traffic can prevent Viessmann devices from booting properly after
  # a power cycle (see issue #37), it's recommended to keep the reconnect period to be at least 1minute
  # so that if a power cycle of the Viessmann device is happening, its boot process won't be interrupted by Optolink traffic.
  reconnect_period_sec: 60
  # Give up (and exit with an error) if the Optolink serial port cannot be (re)opened 
  # within this time
  reconnect_timeout_sec: 600
  # Re-initialize the VS2 protocol after this many consecutive read/write failures (e.g. after a heat pump power cycle)
  max_consecutive_failures_before_reinit: 3
  # Timezone of the Viessmann device clock, as an IANA name (e.g. "Europe/Berlin").
  # It is used only by registers of type "datetime_bcd", since the device stores local date/times
  # without timezone. Defaults to the timezone of the host running optolink2mqtt; set it explicitly
  # when running in Docker, where the host timezone is usually UTC.
  #timezone: "Europe/Berlin"

mqtt:
  # broker: details about the MQTT broker
  broker:
    host: localhost
    port: 1883
    #username:
    # Set the password with MQTT_BROKER_PASSWORD or provide a Docker secret file using
    # MQTT_BROKER_PASSWORD_FILE=/run/secrets/mqtt_broker_password.
    # MQTT_BROKER_PASSWORD takes precedence if both environment variables are set.
    # NOTE: the password is sent only if the username is set as well.
    #password:
    # tls: if true, connect to the broker over TLS and verify its certificate.
    # Defaults to true if the port is 8883, false otherwise.
    #tls: false
    # ca_certs: CA bundle used to verify the broker certificate; defaults to the system CA store.
    #ca_certs: /etc/ssl/certs/my-broker-ca.pem
    # certfile/keyfile: optional client certificate and private key, for brokers requiring
    # TLS client authentication.
    #certfile:
    #keyfile:
  
  # client_id: the identifier of the MQTT client created by optolink2mqtt; this is useful to identify optolink2mqtt
  # when inspecting the MQTT broker logs
  clientid: optolink2mqtt
  
  # qos: it can be:
  #  - At most once (QoS 0)
  #  - At least once (QoS 1)
  #  - Exactly once (QoS 2)
  # see https://www.hivemq.com/blog/mqtt-essentials-part-6-mqtt-quality-of-service-levels/
  qos: 0
  
  # retain: if set to true, the message will be set as the "last known good"/retained message for 
  # each topic populated by optolink2mqtt
  retain: false

  # reconnect_period_sec: defines how frequently optolink2mqtt will re-attempt a connection to the MQTT broker
  # if the connection is lost. You should be setting this parameter to the smallest value that makes sense
  # according to your optolink2mqtt scheduling rules.
  reconnect_period_sec: 5

  # request: name of the topic that optolink2mqtt will subscribe to, and where it will wait for information requests;
  # FIXME: this feature is not yet implemented !! If you need it please open an issue on GitHub !!
  request_topic: "optolink2mqtt/request/"

  ha_discovery:
    # ha_discovery.enabled: if set to true, optolink2mqtt will publish a "homeassistant" MQTT discovery topic
    # for each register having the 'ha_discovery' configuration parameters set in the "registers_poll_list" list.
    # This will enable HomeAssistant to immediately recognize as sensors the information published by optolink2mqtt
    # (see https://www.home-assistant.io/integrations/sensor.mqtt/)
    enabled: true

    # ha_discovery.topic: defines the topic that optolink2mqtt will publish its "homeassistant" MQTT discovery topics;
    topic: homeassistant

    # ha_discovery.device_name: the name of the device grouping all sensors published to HomeAssistant;
    # it defaults to the <hostname> of the computer
    device_name: "Vitocal"  # or Vitodens, etc

# this is the core of config, defininig which registers should be read by optolink2mqtt, how frequently and
# how they should be published to MQTT
registers_poll_list:

  - name: external_temperature
    sampling_period_seconds: 10

    # each register of the Viessmann device has a few key attributes you need to know/discover:
    # the address, its length (in bytes), its type, its scale factor, whether the number contained is
    # signed or not, and if the register is writable or read-only.
    register: 0x0101
    length: 2
    # type: how the register bytes are decoded; it can be:
    #  - int: a little-endian integer (this is the default)
    #  - float: a little-endian integer multiplied by "scale_factor"; a scale factor is allowed only for this type
    #  - enum: a little-endian integer mapped to a label through the "enum" dictionary
    #  - datetime_bcd: the 8-byte Viessmann DateTimeBCD format, published as an ISO 8601 date/time
    type: float
    scale_factor: 0.1
    signed: false
    writable: false

    # the whole "ha_discovery" section is optional and is useful only if you have
    # mqtt.ha_discovery.enabled set to "true" and you use HomeAssistant.
    ha_discovery:
      name: "External Temperature"
      platform: sensor                   # this can be "sensor", "binary_sensor"
      device_class: temperature          # see https://www.home-assistant.io/integrations/sensor.mqtt/#device-class
      unit_of_measurement: "°C"          # for a list of supported measurement units check https://github.com/f18m/viessmann-optolink2mqtt/blob/main/src/optolink2mqtt/ha_units.py


  # another register example, showing a different measurement unit:

  - name: dhw_electric_energy_kwh
    sampling_period_seconds: 600
    register: 0x1670
    length: 4
    type: float
    scale_factor: 0.1
    signed: false
    writable: false
    ha_discovery:
      name: "Domestic Hot Water Electric Energy kWh"
      platform: sensor
      device_class: energy
      unit_of_measurement: "kWh"

  
  # another register example, showing an enumerated value:

  - name: heating_circuit_1_mode
    sampling_period_seconds: 20
    register: 0xB000
    length: 1
    type: enum
    signed: false
    # IMPORTANT: when a register is flagged as "writable: true", optolink2mqtt will
    # subscribe to the specific MQTT topic '<mqtt.publish_topic_prefix>/<register.name>/set'
    # and will write to the Viessmann device any value that is received from that topic
    writable: true
    enum:
      0: "Off"
      1: "DHW only"
      2: "Heating/Cooling/DHW (time program)"
      4: "Permanently reduced"
      5: "Permanently normal"
      6: "Normal/Off (time program)"
      7: "Cooling only"
    ha_discovery:
      name: "Heating Circuit 1 Mode"
      # writable registers must use a platform that accepts commands from HomeAssistant:
      # "select" for enumerated values, "number" for numeric values, "switch" for on/off values
      platform: select
      entity_category: config
  
  # another register example, showing a writable target temperature:

  - name: dhw_temperature_set
    sampling_period_seconds: 600
    register: 0x6000
    length: 2
    type: float
    scale_factor: 0.1
    writable: true
    ha_discovery:
      name: "Domestic Hot Water Set Temperature"
      platform: number
      device_class: temperature
      entity_category: config
      unit_of_measurement: "°C"
      min: 20
      max: 60
      step: 1
      mode: "box"
      optimistic: false


  # another register example, showing a binary_sensor of type "running":

  - name: heating_circuit_pump
    sampling_period_seconds: 20
    register: 0x0484
    length: 1
    type: int
    signed: false
    writable: false
    ha_discovery:
      name: "Secondary Circuit Pump"
      platform: binary_sensor
      device_class: running
      payload_on: "1"
      payload_off: "0"


  # yet another example, showing the "byte_filter" feature:
  # this is useful because in some cases the Viessmann register is 3 bytes long,
  # but only 2 bytes are relevant for the actual value; in this case you can
  # use the "byte_filter" to specify which bytes should be considered when
  # extracting the value from the register raw data.
  # The same register address can be listed more than once, to extract different
  # bytes of it, as long as every entry for that address has a "byte_filter".

  - name: dhw_temperature_top
    sampling_period_seconds: 20
    register: 0x01CD
    length: 3
    type: float
    scale_factor: 0.1
    byte_filter: "b:0:1"  # of the 3 bytes, consider only the first two bytes; then apply the scale factor
    signed: true
    writable: false
    ha_discovery:
      name: "Domestic Hot Water Top Temperature"
      platform: sensor
      device_class: temperature
      unit_of_measurement: "°C"


  # another example, showing how to split a register into several values, read only once,
  # with the "same_read_as", "encoding" and "formatter" features.
  # The 8-byte device identification block at 0x00F8 contains, in address order, the
  # device code (2 bytes), the hardware index, the software index, the LDA and RDA
  # protocol identifiers (1 byte each) and the developer version code (2 bytes);
  # e.g. "20 CB 04 60 00 00 01 0A" is published as device code "20CB", hardware
  # index "0x04" and developer version code "0x010A".
  #  * "same_read_as" copies "register" and "length" from the entry with the given name.
  #    All the entries with the same register address and length are read from the device
  #    only once per poll, and decoded for each of them, so they must have the same
  #    "sampling_period_seconds".
  #  * "encoding" is the byte order of "int", "float" and "enum" registers (and of the bytes
  #    selected by "byte_filter"): "little_endian" (the default, used by most Viessmann
  #    registers) or "big_endian" (keep the address order, as for identification codes).
  #  * "formatter" is a Jinja2 template (https://jinja.palletsprojects.com/en/stable/templates/)
  #    applied to the decoded value, available as "x"; the rendered string is published
  #    on MQTT. E.g. "{{ '%04X' | format(x) }}" publishes the value in hexadecimal with 4
  #    digits. A formatter is allowed only on read-only registers. Default: no formatter.

  - name: device_code
    sampling_period_seconds: 3600
    register: 0x00F8
    length: 8
    byte_filter: "b:0:1"
    encoding: big_endian
    formatter: "{{ '%04X' | format(x) }}"
    ha_discovery:
      name: "Device Code"
      platform: sensor
      entity_category: diagnostic
      icon: mdi:identifier

  - name: device_hardware_index
    sampling_period_seconds: 3600
    same_read_as: device_code
    byte_filter: "b:2:2"
    formatter: "0x{{ '%02X' | format(x) }}"
    ha_discovery:
      name: "Hardware Index"
      platform: sensor
      entity_category: diagnostic
      icon: mdi:identifier

  - name: device_developer_version_code
    sampling_period_seconds: 3600
    same_read_as: device_code
    byte_filter: "b:6:7"
    encoding: big_endian
    formatter: "0x{{ '%04X' | format(x) }}"
    ha_discovery:
      name: "Developer Version Code"
      platform: sensor
      entity_category: diagnostic
      icon: mdi:identifier


  # another register example, showing a writable date/time (type "datetime_bcd"):
  # optolink2mqtt publishes it as an ISO 8601 date/time with the UTC offset of "optolink.timezone",
  # e.g. "2026-12-24T00:00:00+01:00", or "None" if the date/time is not set on the device.
  # Writing an ISO 8601 date/time sets it; writing "None" (or any date before year 2000) clears it.
  # The HomeAssistant "datetime" platform requires HomeAssistant 2026.5 or later; for a read-only
  # date/time use the "sensor" platform with "device_class: timestamp".

  - name: holiday_program_start
    sampling_period_seconds: 600
    register: 0x2309
    length: 8
    type: datetime_bcd
    writable: true
    ha_discovery:
      name: "Holiday Program Start"
      platform: datetime
      entity_category: config


  # PLEASE NOTE THAT DISCOVERING THE CORRECT REGISTERS TO POLL IS
  # SOMETHING YOU NEED TO DO BY YOURSELF, AS IT DEPENDS ON THE
  # MODEL OF YOUR VIESSMANN DEVICE AND ITS CONFIGURATION.
  # Check the README of this project for some hints on that.
